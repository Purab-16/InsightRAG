services:
  - type: web
    name: insightrag-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      # If the build fails on 3.14 (pymupdf, pydantic-core or supabase wheels), change this to 3.13.x.
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: ENV
        value: production
      # Secrets and per-environment values: set in the Render dashboard, never in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      - key: GEMINI_EMBED_MODEL
        sync: false
      - key: S2_API_KEY
        sync: false
      # Exact frontend origin(s), comma separated. Start with localhost, replace with the Vercel URL later. Never "*".
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: EMBED_DIM
        value: "768"
